name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Route types first: tsc needs what `next typegen` writes.
      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npx playwright install --with-deps chromium

      # The backend-free suite. The full multi-phone round in tests/e2e/room.spec.ts
      # needs a throwaway Supabase project and runs when E2E_SUPABASE is set.
      - run: npx playwright test tests/e2e/smoke.spec.ts
